[package]
name = "proxy-jail"
version = "0.1.0"
edition = "2024"
description = "Force GUI applications through SOCKS5 proxy using network namespaces"

[[bin]]
name = "proxy-jail"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", features = ["process", "signal", "user", "fs", "sched"] }
users = "0.11"
libc = "0.2"
dirs = "6"
