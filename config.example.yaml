# Proxy Jail Configuration
# Place this file at ~/.config/proxy-jail/config.yaml
#
# host: Use "gateway" to route through the host's network namespace
#       gateway IP (for proxies listening on localhost).  Otherwise
#       use a LAN or external IP that the namespace can reach directly.

jails:
  - name: work
    proxy:
      host: "gateway"
      port: 1080
      type: socks5
      # Optional authentication
      # auth:
      #   username: "user"
      #   password: "pass"

    # Optional: specify subnet (auto-assigned if not set)
    # subnet: "10.10.0.0/24"



  - name: gaming
    proxy:
      host: "proxy.example.com"
      port: 1080
      type: socks5



# Example usage:
# 1. Create a jail:
#    proxy-jail jail create work --socks5 127.0.0.1:1080
#
# 2. Run an application:
#    proxy-jail app run work -- firefox
#
# 3. Install desktop entry:
#    proxy-jail app desktop install work firefox
#
# 4. List jails:
#    proxy-jail jail list
#
# 5. Stop a jail:
#    proxy-jail jail stop work
#
# 6. Delete a jail:
#    proxy-jail jail delete work
